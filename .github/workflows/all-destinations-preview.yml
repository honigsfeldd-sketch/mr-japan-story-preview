name: All destinations preview

on:
  push:
    branches:
      - codex/all-destinations-preview
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: all-destinations-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}prototypes/orna-yigal-trip-reveal/
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Prepare static preview
        run: |
          mkdir -p _site/prototypes _site/assets _site/japan_trip_images_high_quality_named
          cp -R prototypes/orna-yigal-trip-reveal _site/prototypes/
          cp -R prototypes/culinaryx-presentation _site/prototypes/
          cp -R prototypes/culinaryx-refined _site/prototypes/
          cp -R assets/hero_images _site/assets/
          cp -R assets/icons _site/assets/
          cp -R japan_trip_images_high_quality_named/. _site/japan_trip_images_high_quality_named/
          rm -f _site/prototypes/orna-yigal-trip-reveal/assets/audio/story-music.mp3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
